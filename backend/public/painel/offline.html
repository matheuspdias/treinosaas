<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Sem internet · TreinoBox</title>
    <style>
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               background: #121212; color: #f2efe8; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
        h1 { font-size: 1.5rem; margin: 16px 0 8px; }
        p { color: #a3a098; margin: 0 auto; max-width: 22rem; }
        button { margin-top: 24px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px;
                 background: #ffd100; color: #121212; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/painel/icon-192.png" alt="" width="72" height="72" style="border-radius: 22%">
        <h1>Sem conexão com a internet</h1>
        <p>O painel precisa de internet para mostrar os alunos e os treinos. Confira o Wi-Fi ou os dados móveis.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
</body>
</html>
