    <script>
      // Pinta o tema certo antes do React carregar (evita piscar branco no modo escuro).
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('treinoapp.theme') || 'system'
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0b0d10' : '#f4f5f7'
      })()
    </script>
