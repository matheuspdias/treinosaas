# Ambiente de desenvolvimento. Portas diferentes do barberflow para os dois poderem rodar juntos.
services:

  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: treinosaas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - treinosaas

  nginx:
    image: nginx:1.27-alpine
    container_name: treinosaas_nginx
    restart: unless-stopped
    ports:
      - "8010:80"
    volumes:
      - ./backend:/var/www/html
      # Imagens do catálogo de exercícios: as mesmas da PWA, sem cópia.
      - ./pwa/public/exercises:/var/www/html/public/exercises:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - treinosaas

  postgres:
    image: postgres:16-alpine
    container_name: treinosaas_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-treinosaas}
      POSTGRES_USER: ${DB_USERNAME:-treinosaas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-treinosaas}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - treinosaas

  redis:
    image: redis:7-alpine
    container_name: treinosaas_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - treinosaas

  # Vite do painel (backend) e da PWA. Uso: make panel-dev / make pwa-dev, ou `docker compose run --rm node ...`
  node:
    image: node:22-bookworm-slim
    working_dir: /workspace
    user: "1000:1000"
    volumes:
      - .:/workspace
    profiles: ["tools"]
    networks:
      - treinosaas

volumes:
  postgres_data:
  redis_data:

networks:
  treinosaas:
    driver: bridge
