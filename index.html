<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TreinoApp</title>
    <meta name="description" content="Registro de treinos de musculação, 100% offline." />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Pinta o tema certo antes do React carregar (evita piscar branco no modo escuro).
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('treinoapp.theme') || 'system'
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0b0d10' : '#f4f5f7'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O TreinoApp precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
